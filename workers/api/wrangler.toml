#:schema node_modules/wrangler/config-schema.json
name = "groundsnearme-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# ---------------------------------------------------------------------------
# Non-secret config. Secrets (SUPABASE_SERVICE_ROLE_KEY, SUPABASE_JWT_SECRET)
# are set with `wrangler secret put NAME` and never live in this file.
# ---------------------------------------------------------------------------
[vars]
SUPABASE_URL         = "https://mfybkflgkjpuqhlthagt.supabase.co"
SUPABASE_ANON_KEY    = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1meWJrZmxna2pwdXFobHRoYWd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzEzNzgsImV4cCI6MjEwMzc0NzM3OH0.z5r3FXEsGS7OPLR1Rugn7XDlYHxKMhdvDWsUcfnL20I"
R2_PUBLIC_BASE_URL   = "https://images.groundsnearme.pk"
ALLOWED_ORIGINS      = "https://groundsnearme.pk,https://www.groundsnearme.pk,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500"
WHATSAPP_INTAKE_NUMBER = "923000000000"
API_VERSION          = "v1"

# Ground images. Bucket is public-read via a custom domain on the bucket;
# writes only ever happen through this Worker, gated to staff.
[[r2_buckets]]
binding    = "IMAGES"
bucket_name = "groundsnearme-images"

# Optional. If absent, rate limiting degrades to a no-op (see lib/ratelimit.js).
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id      = "REPLACE_ME"

# Housekeeping: release lapsed slot holds, close finished bookings,
# expire past matchmaking posts.
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
[env.staging]
name = "groundsnearme-api-staging"

[env.staging.vars]
SUPABASE_URL         = "https://REPLACE_ME_STAGING.supabase.co"
SUPABASE_ANON_KEY    = "REPLACE_ME_STAGING_ANON_KEY"
R2_PUBLIC_BASE_URL   = "https://images-staging.groundsnearme.pk"
ALLOWED_ORIGINS      = "http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500"
WHATSAPP_INTAKE_NUMBER = "920000000000"
API_VERSION          = "v1"

[[env.staging.r2_buckets]]
binding     = "IMAGES"
bucket_name = "groundsnearme-images-staging"
